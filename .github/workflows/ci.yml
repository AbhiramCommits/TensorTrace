name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: ruff check .

      - name: Pytest (fast suite, excluding slow)
        if: matrix.python-version != '3.11'
        run: pytest -q --cov=tensortrace --cov-report=term-missing -m "not slow"

      - name: Pytest (full suite including slow)
        if: matrix.python-version == '3.11'
        run: pytest -q --cov=tensortrace --cov-report=term-missing

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensortrace-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
