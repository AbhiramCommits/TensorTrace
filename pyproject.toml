[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensortrace"
version = "0.1.0"
description = "Linux-aware ML inference profiler: per-layer latency meets kernel counters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TensorTrace contributors" }]
keywords = ["profiling", "pytorch", "onnxruntime", "linux", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "psutil>=5.9",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
tensortrace = "tensortrace.cli:main"

[tool.setuptools.packages.find]
include = ["tensortrace*"]

[tool.setuptools.package-data]
tensortrace = ["report/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: integration tests that execute real inference workloads",
]

[tool.coverage.run]
source = ["tensortrace"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
